<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Rebel Profiler Bridge</title>
    <style>
      body { font: 13px system-ui, sans-serif; width: 320px; margin: 12px; }
      .row { margin: 6px 0; }
      input { width: 100%; box-sizing: border-box; padding: 4px; }
      button { padding: 4px 10px; }
      #status { margin-top: 8px; white-space: pre-wrap; }
      .ok { color: #0a7d32; }
      .bad { color: #b3261e; }
    </style>
  </head>
  <body>
    <h3>Rebel Profiler Bridge</h3>
    <div class="row">
      <label>Bridge token <input id="token" placeholder="(none)" /></label>
    </div>
    <div class="row">
      <button id="save">Save</button>
      <button id="check">Check bridge</button>
      <button id="poll">Run now</button>
    </div>
    <div class="row">
      <button id="grant">Grant site access</button>
      <span style="color:#666;font-size:11px">Firefox: once, so pages can be read</span>
    </div>
    <div id="status">idle</div>
    <script src="popup.js"></script>
  </body>
</html>

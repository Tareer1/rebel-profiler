[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rebel-profiler"
version = "1.6.1"
description = "Kali Linux Cybersecurity Intelligence & Authorized Security Operations Framework"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "REBEL" }]
dependencies = []

[project.optional-dependencies]
# AirLLM-mode: 70B-class models on low-end hardware (layer-wise streaming).
# GPU is optional — CPU-only and Apple-silicon (MPS) placement both work.
airllm = ["airllm>=2.0", "torch"]
airllm-compression = ["airllm>=2.0", "torch", "bitsandbytes"]
# GGUF checkpoints (single-file llama.cpp / Ollama / LM Studio exports).
# Prebuilt CPU/CUDA wheels avoid a source build — see docs/SETUP.md.
gguf = ["llama-cpp-python>=0.2.0"]
# Native layer streaming over HF safetensors checkpoints already on disk.
native = ["torch"]

[project.scripts]
rebel-profiler = "rebel_profiler.cli.main:main"
rp-mcp = "rebel_profiler.llm.hermes_mcp:main"

[tool.setuptools.packages.find]
include = ["rebel_profiler*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

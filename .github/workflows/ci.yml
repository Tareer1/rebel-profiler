name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  # The core contract: the tool must work with ZERO optional dependencies.
  # If this job ever needs an extra package, the stdlib-only promise is broken.
  tests:
    name: pytest (Python ${{ matrix.python-version }}) — stdlib only
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      # The gated adapters shell out to whitelisted binaries; doctor asserts
      # they exist, so the CI runner must carry them like a Kali box would.
      - name: Install whitelisted tool binaries (nmap, whois)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nmap whois

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package (core is stdlib-only)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest

      - name: Show environment
        run: |
          python --version
          python -m pip list

      # -rs prints the reasons for skips, so an engine quietly going missing
      # is visible in the log rather than silently reducing coverage.
      - name: Run full test suite
        run: python -m pytest tests/ -q -rs

      # The LLM plane must import and fall back to the tiny engine cleanly
      # on machines without airllm — exercise that contract explicitly.
      - name: LLM plane smoke (tiny-engine fallback contract)
        run: |
          python -m rebel_profiler.cli.main llm status
          python -m rebel_profiler.cli.main llm models

  # The engines job: install the optional native (torch) and GGUF
  # (llama-cpp-python) dependencies and run the whole suite again. This is
  # where the real forward pass, the real quantization round-trip and the real
  # llama.cpp binding get exercised — the stdlib job skips those tests, so
  # without this job a broken engine would ship unnoticed.
  engines:
    name: engines (torch + llama.cpp)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Doctor's tool check must pass here too: same whitelist, same reason.
      - name: Install whitelisted tool binaries (nmap, whois)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nmap whois

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package + test deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest

      # CPU-only torch on purpose: the plane must never require a GPU, and the
      # CPU build is what most operators have.
      - name: Install native engine dependency (CPU torch)
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      # Prebuilt CPU wheel index avoids a multi-minute source build. If the
      # wheel is unavailable for this interpreter, pip falls back to building
      # from source — the runner has cmake and a C++ toolchain for that case.
      - name: Install GGUF engine dependency (prebuilt CPU wheel)
        run: >-
          python -m pip install llama-cpp-python
          --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu

      # Fail fast and loudly if an install silently provided nothing: a green
      # run with both engines missing would be worse than a red one.
      - name: Assert both engines actually imported
        run: |
          python -c "import torch; print('torch', torch.__version__, 'cuda', torch.cuda.is_available())"
          python -c "import llama_cpp; print('llama_cpp', getattr(llama_cpp, '__version__', 'unknown'))"

      - name: Engine smoke through the CLI
        run: |
          python -m rebel_profiler.cli.main doctor
          python -m rebel_profiler.cli.main llm setup
          python -m rebel_profiler.cli.main llm local
          python -m rebel_profiler.cli.main llm status -o json

      # `-rs` makes it obvious if the engine tests are still skipping — that
      # would mean the dependencies did not land and this job proved nothing.
      - name: Full suite with real engine dependencies
        run: python -m pytest tests/ -q -rs

      # A green run in which the engine tests still skipped would prove
      # nothing, so this gate asserts they actually executed. It deliberately
      # relies on exit codes rather than parsed output text:
      #   * pytest exits 5 when the -k filter matches nothing at all;
      #   * when EVERY selected test skips, pytest prints no count line — only
      #     SKIPPED entries — so grepping for "N skipped" would let a
      #     dependency-less run pass. Match the SKIPPED entries instead;
      #   * redirecting (not piping) keeps pytest's own exit code visible, so
      #     real test failures cannot be masked by a successful `tee`.
      - name: Fail if the engine tests were skipped anyway
        run: |
          python -m pytest tests/test_llm_airllm_features.py tests/test_llm_gguf.py \
            -q -rs -p no:cacheprovider -k "RealTorch or RealBinding" \
            > /tmp/engine-tests.txt 2>&1
          rc=$?
          cat /tmp/engine-tests.txt
          if [ "$rc" -eq 5 ]; then
            echo "::error::the engine-test filter matched nothing — tests were renamed"
            exit 1
          fi
          if [ "$rc" -ne 0 ]; then
            echo "::error::engine tests failed (pytest exit $rc)"
            exit 1
          fi
          if grep -q "SKIPPED" /tmp/engine-tests.txt; then
            echo "::error::engine tests were skipped — the dependencies did not install"
            exit 1
          fi
          echo "engine tests executed against the real bindings"
